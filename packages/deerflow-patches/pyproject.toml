[project]
name = "deerflow-patches"
version = "0.1.0"
description = "Runtime monkey-patch layer binding tenant isolation into DeerFlow without touching its source (the only invasive package; loaded by agent-runtime only)"
requires-python = ">=3.12"
dependencies = [
    "tenancy-core",
    # The patch targets live in the deerflow gateway app layer; the exact
    # pinned upstream ref is recorded in upstream/PIN.md and enforced by
    # patch-integrity tests.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_patches"]

[tool.uv.sources]
tenancy-core = { workspace = true }
